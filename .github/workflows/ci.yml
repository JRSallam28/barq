name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          {
            echo "PUBLIC_PORT=8090"
            echo "POSTGRES_PASSWORD=$password"
            echo "DATABASE_URL=postgresql://barq_app:$password@postgres:5432/barq_tasks"
            echo "REDIS_URL=redis://redis:6379/0"
          } >> "$GITHUB_ENV"

      - name: Syntax and Compose checks
        run: |
          bash -n backup.sh restore.sh
          python3 -m py_compile validate.py failure_test.py
          docker compose -p barq-assessment config --quiet

      - name: Build
        run: docker compose -p barq-assessment build

      - name: Start
        run: docker compose -p barq-assessment up -d

      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/ready >/dev/null; then
              echo "Application ready after attempt $attempt."
              exit 0
            fi
            sleep 1
          done

          echo "Application did not become ready." >&2
          docker compose -p barq-assessment ps
          docker compose -p barq-assessment logs
          exit 1

      - name: Validate environment
        run: ./validate.py

      - name: Show service status
        if: always()
        run: docker compose -p barq-assessment ps

      - name: Cleanup
        if: always()
        run: docker compose -p barq-assessment down -v
